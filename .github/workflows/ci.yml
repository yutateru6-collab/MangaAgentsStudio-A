name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  scaffold-windows:
    name: Scaffold test (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion

      - name: Run scaffold test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-Scaffold.ps1
